[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]   # Ship the src/ directory as the importable package

[project]
name = "cricketiq"
version = "0.1.0"
description = "AI-powered cricket analytics and tactical intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kanha Gupta", email = "kanha.gupta@accenture.com" }]

dependencies = [
    # ── Data & Analytics ──────────────────────────────────────────
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scipy>=1.12.0",               # Statistical functions

    # ── Machine Learning ──────────────────────────────────────────
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",               # Model serialization

    # ── Database ─────────────────────────────────────────────────
    "sqlalchemy>=2.0.0",           # SQL query builder (Core, not ORM)
    "alembic>=1.13.0",             # Database migrations
    "psycopg2-binary>=2.9.9",      # PostgreSQL driver

    # ── Data Validation & Settings ───────────────────────────────
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",    # .env file loading with type safety

    # ── Frontend ─────────────────────────────────────────────────
    "streamlit>=1.32.0",

    # ── AI / LLM ──────────────────────────────────────────────────
    "google-generativeai>=0.5.0",  # Gemini API (free tier)
    "groq>=0.5.0",                 # Groq fallback (free tier)

    # ── HTTP / Downloads ──────────────────────────────────────────
    "httpx>=0.27.0",               # Async-capable HTTP client for Cricsheet downloads
    "tenacity>=8.2.0",             # Retry logic for downloads / API calls

    # ── Utilities ─────────────────────────────────────────────────
    "python-dotenv>=1.0.0",        # Load .env files
    "rich>=13.7.0",                # Pretty terminal output for scripts
    "click>=8.1.0",                # CLI interface for scripts
    "pytz>=2024.1",                # Timezone handling
]

[project.optional-dependencies]
dev = [
    # ── Testing ──────────────────────────────────────────────────
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",          # Coverage reporting
    "pytest-mock>=3.12.0",        # Mocking in tests

    # ── Code Quality ─────────────────────────────────────────────
    "ruff>=0.3.0",                 # Linting + formatting (replaces flake8 + black)
    "mypy>=1.9.0",                 # Static type checking

    # ── Notebooks ────────────────────────────────────────────────
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",

    # ── Type stubs ───────────────────────────────────────────────
    "pandas-stubs>=2.2.0",
    "types-pytz>=2024.1",
]

rag = [
    # ── RAG / Embeddings (V2 — install separately) ───────────────
    "sentence-transformers>=2.7.0",  # Local embeddings, no API needed
    "pgvector>=0.2.5",               # pgvector Python client
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]  # Errors, pyflakes, isort, naming, warnings, upgrades
ignore = ["E501"]                          # Line length handled separately

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false                   # Start relaxed; tighten as project matures
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70                  # CI fails if coverage drops below 70%
